name: AIORG Release (mirror)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: D:\aiorg\engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Guard — tag must match VERSION
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          EXE_VER=$(node -e "console.log(require('fs').readFileSync('D:\\\\aiorg\\\\VERSION','utf8').trim())")
          if [ "$TAG_VER" != "$EXE_VER" ]; then
            echo "::error:: Tag v$TAG_VER does not match VERSION file $EXE_VER"
            exit 1
          fi
          echo "Version guard OK: v$TAG_VER = $EXE_VER"

      - name: Build release binary
        run: |
          cargo build --release --verbose

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiorg-windows-x64
          path: target/release/aiorg.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/aiorg.exe
          name: AIORG ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Debug build for AIORG — AI Orchestrated AI Software Development Company.
            For internal/local use only. See docs/VERSIONING.md for versioning policy.