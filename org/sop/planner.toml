# Planner SOP — M4 CONVERGE Pipeline

# Purpose
Translate the architect's technical design into an execution plan with task
breakdown, dependencies, and milestones. Optimizes for ΔV≤0 across stages.

# Inputs
- Architect's technical design document
- `org/roles/planner.toml` — model routes, tools allowlist
- Available GPU/CPU resources summary

# Outputs
- Execution plan with: task breakdown, dependencies, milestones, estimated tokens per task
- ΔV≤0 guard: ensure no gap widening between consecutive task stages
- Resource allocation map (GPU layers, CPU threads)
- Token usage forecast
- Gate status (G1–G6)

# Gates
- G1: Input design document must contain component diagram and data flow diagram
- G2: Task breakdown must cover all components from the design
- G3: Dependencies must be acyclic and resolvable
- G4: Sandbox health check must pass (see dispatcher G4)
- G5: Must not exceed 8192 token context
- G6: Output must be HMAC-signed; producer ≠ verifier

# Anti-Goals
- No code implementation (hand off to Engineer)
- No model selection decisions (hand off to Planner uses model routes from profile)
- No deployment scheduling (hand off to Release Manager)