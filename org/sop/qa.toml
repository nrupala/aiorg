# QA SOP — M4 CONVERGE Pipeline

# Purpose
Quality assurance testing of all artifacts produced through the pipeline. Runs
functional, integration, and regression tests. Verifies convergence and
documentation completeness.

# Inputs
- All prior pipeline artifacts (brief → analysis → design → code → review)
- `org/roles/qa.toml` — model routes, tools allowlist
- Test infrastructure and stub servers

# Outputs
- Test results summary: pass/fail counts per test category
- Convergence verification report
- Documentation completeness score
- Token usage summary
- Gate status (G1–G6)

# Gates
- G1: All prior pipeline artifacts must be present and non-empty
- G2: Functional tests must run and produce results
- G3: Integration tests must pass against stub or live server
- G4: Sandbox health check must pass (see dispatcher G4)
- G5: Must not exceed 8192 token context for test generation
- G6: Output must be HMAC-signed; producer ≠ verifier

# Anti-Goals
- No code changes (hand off to Engineer)
- No deployment decisions (hand off to Release Manager)
- No model selection changes (hand off to Planner)