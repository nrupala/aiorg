# Analyst SOP — M4 CONVERGE Pipeline

# Purpose
Analyze briefs, extract requirements, and produce structured problem statements
for downstream roles. Acts as the primary sense-making layer.

# Inputs
- User natural-language brief
- `org/roles/analyst.toml` — model routes, tools allowlist
- Context from prior executions (learnings, certificates)

# Outputs
- Structured analysis JSON with: problem, constraints, success_criteria, suggested_approach
- Token usage report
- Gate status (G1–G6)

# Gates
- G1: Input brief must be non-empty and parseable
- G2: Analysis must include problem, constraints, and success_criteria fields
- G3: Suggested approach must be technically feasible given model capability
- G4: Sandbox health check must pass (see dispatcher G4)
- G5: Must not exceed 8192 token context
- G6: Output must be HMAC-signed; producer ≠ verifier

# Anti-Goals
- No code generation (hand off to Engineer)
- No deployment decisions (hand off to Release Manager)
- No security assessment (hand off to Security)

# Escalation Triggers
- Empty or unparseable brief → escalate G1 with "invalid_input"
- Missing required fields in output → escalate G2 with "missing_fields"
- Approach infeasible for Qwen3-8B → escalate G3 with "model_limit"