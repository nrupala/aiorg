[package]
name = "aiorg-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aiorg"
path = "src/main.rs"

[workspace]
members = ["provider"]

[dependencies]
anyhow = "1"
provider = { path = "provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
