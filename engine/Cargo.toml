[package]
name = "aiorg-engine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aiorg"
path = "src/main.rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
glob = "0.3"
tempfile = "3"
base64 = "0.22"
getrandom = "0.2"
provider = { path = "provider" }